name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test -short -race ./...

  integrations:
    # Hermetic Docker Compose e2e tests -- see integration/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration tests (stream, inspect, sync, huddle)
        run: go test ./client/... -run 'TestStreamIntegration|TestInspectIntegration|TestSyncIntegration|TestHuddleIntegration' -v -count=1 -timeout 30m

      - name: Command matrix (local relays, blossom container)
        run: go test ./integration/climatrix/... -v -count=1 -timeout 20m

  dashboard:
    # Typecheck, build and size-budget the relay dashboard embedded in ncli.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build (typecheck, bundle, size budget)
        run: npm run build

  dashboard-e2e:
    # The dashboard in headless Chromium against a real relay: sign-in, every
    # chart, an index job, local mode, themes; fails on any CSP violation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Build ncli with the dashboard
        run: |
          cd web/dashboard && npm ci --no-audit --no-fund && npm run build && cd ../..
          go build -o bin/ncli ./cmd/ncli

      - name: Browser
        working-directory: web/dashboard
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: web/dashboard
        run: NCLI_BIN="$GITHUB_WORKSPACE/bin/ncli" npm run e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

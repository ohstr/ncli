name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - CHANGELOG.md
      - docs/public/**
      - .github/workflows/pages.yml
  # The header shows the latest release, read at build time. The push build
  # runs before a release exists, so rebuild once Release finishes.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

jobs:
  docs:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Must be granted here, not inside build-docs.yml itself — a reusable
    # workflow can't self-grant pages/id-token when called cross-repo.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ohstr/docs-kit/.github/workflows/build-docs.yml@main
    with:
      title: ncli
      description: A Nostr relay server and command-line client toolkit for streaming, syncing, inspecting, querying, and mining events.
      accent-hue: 262 # violet, nods at the Nostr ecosystem's usual branding
      favicon-glyph: ">_"
      extra-public-dir: docs/public # install.sh, install.ps1, PROMPT.md

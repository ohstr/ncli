version: 2

project_name: ncli

builds:
  - id: ncli
    main: ./cmd/ncli
    binary: ncli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/ohstr/ncli/cli/common.version={{.Version}}+{{.ShortCommit}}

archives:
  - id: ncli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# dockers_v2 (buildx, single multi-platform build) hit intermittent
# "failed to calculate checksum of ref ...: not found" COPY failures in CI,
# twice in a row on linux/amd64, that we couldn't pin down or reproduce
# locally. Rolled back to the older per-arch dockers + docker_manifests
# pipe (deprecated but battle-tested): each arch gets its own
# single-platform buildx build, then docker_manifests stitches the two
# per-arch tags into the multi-arch tag.
#
# Each arch is split into a "-versioned" entry (always pushed, so every
# release -- including an RC -- gets an installable image under its own
# tag) and a "-latest" entry (skip_push: auto, so only a stable release
# ever moves the latest-* tags). A single entry can't do both: skip_push
# applies to every image_template in that entry, so latest can't be
# pushed if the version tag doesn't push too.
dockers:
  - id: ncli-amd64-versioned
    ids: [ncli]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: build/relay/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/ncli:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: ncli-amd64-latest
    ids: [ncli]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: build/relay/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/ncli:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
    skip_push: auto
  - id: ncli-arm64-versioned
    ids: [ncli]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: build/relay/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/ncli:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
  - id: ncli-arm64-latest
    ids: [ncli]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: build/relay/Dockerfile.release
    image_templates:
      - "ghcr.io/ohstr/ncli:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
    skip_push: auto

# Same split as above, one level up: the versioned manifest always
# stitches the two versioned per-arch tags; the latest manifest only
# stitches the two latest-* tags, and only pushes for a stable release.
docker_manifests:
  - name_template: "ghcr.io/ohstr/ncli:{{ .Version }}"
    image_templates:
      - "ghcr.io/ohstr/ncli:{{ .Version }}-amd64"
      - "ghcr.io/ohstr/ncli:{{ .Version }}-arm64"
  - name_template: "ghcr.io/ohstr/ncli:latest"
    image_templates:
      - "ghcr.io/ohstr/ncli:latest-amd64"
      - "ghcr.io/ohstr/ncli:latest-arm64"
    skip_push: auto

# brews has no Pro-only "versioned formula" feature (that's cask-only), so
# an RC gets its own formula name instead: skip_upload is auto (skip on
# prerelease) for the stable `ncli` formula, and the inverse for `ncli-rc`
# (skip unless it's a prerelease) so `brew install/upgrade ncli` never
# resolves to an RC, but `brew install ohstr/tap/ncli-rc` can still try one.
brews:
  - name: ncli
    repository:
      owner: ohstr
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ohstr/ncli"
    description: "A single binary for running and operating Nostr relays: serve, stream, sync, inspect, search, export, and mine events."
    license: "Unlicense"
    conflicts: ["ncli-rc"]
    install: |
      bin.install "ncli"
    test: |
      system "#{bin}/ncli", "version"
    skip_upload: auto
  - name: ncli-rc
    repository:
      owner: ohstr
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ohstr/ncli"
    description: "Release-candidate build of ncli -- see the ncli formula for stable installs."
    license: "Unlicense"
    conflicts: ["ncli"]
    install: |
      bin.install "ncli"
    test: |
      system "#{bin}/ncli", "version"
    skip_upload: '{{ if .Prerelease }}false{{ else }}true{{ end }}'

# No `changelog:` block here, deliberately -- GoReleaser's changelog pipe
# is also the only place that loads a `--release-notes` file into the
# release body (internal/pipe/changelog.(Pipe).Run, before it ever
# reaches the auto-changelog-from-commits code that follows that early
# return). `changelog.disable: true` used to be set here to mean "don't
# auto-generate from commits, we pass --release-notes explicitly" --
# but that disables the whole pipe, including the --release-notes load,
# so every release's body ended up empty despite release.yml passing
# `--release-notes` correctly. Since release.yml always passes that
# flag, the pipe's own early-return already guarantees notes come from
# CHANGELOG.md, never GoReleaser's commit-log changelog, with no
# `disable` needed.
release:
  github:
    owner: ohstr
    name: ncli
  # Default is keep-existing, which would leave a stale/minimal body in
  # place if a Release for the tag already exists (e.g. from a prior
  # failed/retried run) instead of using --release-notes below.
  mode: replace
  prerelease: auto

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ncli-relay.fullname" . }}-config
  labels:
    {{- include "ncli-relay.labels" . | nindent 4 }}
data:
  relay.yaml: |
    {{- required "relayConfig is required: --set-file relayConfig=deploy/stacks/<kind>/relay.yaml" .Values.relayConfig | nindent 4 }}

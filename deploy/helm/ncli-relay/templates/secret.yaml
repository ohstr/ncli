{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ncli-relay.secretName" . }}
  labels:
    {{- include "ncli-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.relayPrivkey }}
  relay-privkey: {{ . | quote }}
  {{- end }}
  {{- if .Values.meilisearch.enabled }}
  meili-master-key: {{ required "secrets.meiliMasterKey is required with meilisearch.enabled" .Values.secrets.meiliMasterKey | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  minio-root-user: {{ required "secrets.minioRootUser is required with minio.enabled" .Values.secrets.minioRootUser | quote }}
  minio-root-password: {{ required "secrets.minioRootPassword is required with minio.enabled" .Values.secrets.minioRootPassword | quote }}
  {{- end }}
{{- end }}

# Local dev stack: relay built from this checkout + Meilisearch.
# Usage (from repo root): docker compose -f deploy/stacks/dev/compose.yaml up
# Runtime data lands in ./.dev/ next to this file, which is gitignored.
services:
  relay:
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile
    image: ncli:dev
    container_name: ncli_relay
    command: ["relay", "--config", "/app/ncli/config.yaml"]
    ports:
      - "5500:5500"
    volumes:
      # relay.yaml sets store/logdir to ./data/db and ./data/logs (relative
      # to the relay's cwd, /app/ncli) -- one mount covers both.
      - ./.dev/data:/app/ncli/data
      - ./relay.yaml:/app/ncli/config.yaml:ro
    depends_on:
      - meilisearch
    environment:
      - NCLI_CACHE_PROFILES_SEARCH_MEILISEARCH_KEY=${MEILI_MASTER_KEY:-masterKey}
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.35
    container_name: ncli_search
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data:

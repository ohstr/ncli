# Public relay with profile search, NIP-85 stats and zap-ranked trending:
# relay + Meilisearch.
# Usage (from repo root):
#   cp deploy/stacks/public-search/.env.example deploy/stacks/public-search/.env
#   docker compose -f deploy/stacks/public-search/compose.yaml up -d
#
# There is no weak default key, and Meilisearch is not exposed on the host:
# only the relay is reachable from outside.
services:
  relay:
    image: ghcr.io/ohstr/ncli:${NCLI_VERSION:-0.8.0-rc.54}
    container_name: ncli_relay
    command: ["relay", "--config", "/app/ncli/config.yaml"]
    ports:
      - "${RELAY_BIND:-0.0.0.0}:5500:5500"
    volumes:
      - ncli_data:/app/ncli/data
      - ./relay.yaml:/app/ncli/config.yaml:ro
    depends_on:
      - meilisearch
    environment:
      - NCLI_NIP11_PRIVKEY=${RELAY_PRIVKEY:?Set RELAY_PRIVKEY in .env}
      - NCLI_NIP11_URL=${RELAY_URL:?Set RELAY_URL in .env}
      - NCLI_CACHE_PROFILES_SEARCH_MEILISEARCH_KEY=${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.35
    container_name: ncli_search
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data:
  ncli_data:

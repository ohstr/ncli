# Public relay: anyone may read and post; profile search, NIP-85 stats,
# zap-ranked trending and NIP-66 stats. Secrets come from the environment:
# NCLI_NIP11_PRIVKEY, NCLI_NIP11_URL, NCLI_CACHE_PROFILES_SEARCH_MEILISEARCH_KEY.
# See examples/relay/public-search-relay.yaml for what each block does.
port: 5500

nip11:
  name: "Open Community Relay"
  description: "Public relay with profile search and zap-ranked trending"
  contact: "admin@example.com"
  privkey: ""
  url: ""

store: ./data/db/public-search.db
logdir: ./data/logs

cache:
  profiles:
    search:
      enabled: true
      meilisearch:
        host: http://meilisearch:7700
        key: ""
        index: ncli_public_search
      batchSize: 10000
      maxInFlight: 4
    stats:
      enabled: true
    checks:
      ttl: 7d
  zaps:
    enabled: true
    windows: [24h, 7d, 30d, all]
  relay:
    stats:
      enabled: true

# Rate limits, the recommended values for a public relay (a limit left
# unset is no limit). See skills/ncli-relay-ops/SKILL.md for each key.
limits:
  events:                    # EVENT, WebSocket and POST /events
    perPubkey: {events: 30, per: 1m, burst: 60}
    perIP: {events: 120, per: 1m}
  reads:                     # REQ, COUNT, NEG-OPEN and AUTH
    perIP: {events: 60, per: 1m, burst: 120}
  http:                      # POST /query, /count, /events
    perIP: {events: 60, per: 1m}
  connectionsPerIP: 20
  # Behind a reverse proxy, list its own address as the relay sees it (not
  # a whole network), or every client shares the proxy's per-IP limits:
  # trustedProxies: [172.18.0.1]

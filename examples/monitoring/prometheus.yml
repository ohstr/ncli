# Scrape an ncli relay's admin listener (admin.metrics.enabled).
# Put the token from `ncli relay metrics token add prometheus` in the
# credentials file, readable only by Prometheus.

global:
  scrape_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ncli-relay
    # Through an SSH tunnel or on the relay host; use https and tls_config
    # when admin.tls is set.
    static_configs:
      - targets: ["127.0.0.1:5501"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ncli-relay.token
    # With admin.tls (and clientCA for mTLS):
    # scheme: https
    # tls_config:
    #   ca_file: /etc/prometheus/ncli-admin.crt
    #   cert_file: /etc/prometheus/client.crt
    #   key_file: /etc/prometheus/client.key

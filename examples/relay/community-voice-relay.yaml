# Scenario: a community that meets, not just posts -- a weekly standup, a
# book club, a game night voice channel -- hosted on the same relay as its
# text notes rather than on a third-party call service. Real-time voice
# rooms are served over their own WebSocket at /huddle/{id}/audio. See
# examples/relay/full.yaml for the complete set of nip11 fields and which
# ones `ncli relay` honors from config.
#
# Audio does not share the Nostr socket. That socket decodes every frame as
# JSON, so a binary audio frame on it is a parse error that drops the session --
# hence a separate route, and hence a client connects to both.
#
# A joining client authenticates with a NIP-42 kind:22242 event whose `relay`
# tag names *this relay* (nip11.url below), not the huddle endpoint.
nip11:
  name: "Community Voice Relay"
  description: "Text notes plus live voice rooms for the same community"
  pubkey: "d3345d36e7885ad6340263309a96e0821b22e176ebc721098492063df5516086"
  contact: "admin@example.com"
  # url: required when huddle.enabled is true -- it is what an incoming
  # NIP-42 auth event's relay tag is validated against.
  url: "ws://localhost:5506"

logdir: "./data/logs"
store: "./data/db/community-voice.db"
port: 5506

huddle:
  # Mounts /huddle/{id}/audio. Omitting this block, or leaving enabled false,
  # mounts nothing -- a client then sees the same 404 an older relay gives it.
  enabled: true

  # Cap on concurrent rooms. Rooms are created on the first join and dropped
  # when the last peer leaves, so this bounds simultaneous calls, not how many
  # channels may ever host one. 0 uses the SDK default.
  #
  # There is deliberately no maxPeers: per-room occupancy is a fixed cap in the
  # SDK, because fan-out is quadratic and the limit reflects what one process
  # can carry rather than an operator preference.
  maxRooms: 64

  # Restrict joining to relay members (NIP-43). Independent of
  # nip11.limitation.membership_required, which gates the Nostr socket -- a
  # relay may want open reading and closed calls, or the reverse.
  requireMembership: false

  # Browser origins allowed to connect. Omit or leave empty to allow any, which
  # is the sensible default: admission is gated by a signed NIP-42 challenge, so
  # Origin is not the security boundary here, and restricting it only locks out
  # web clients while every CLI client keeps working. Set it if you want the
  # endpoint reachable from your own app and nowhere else.
  # allowedOrigins:
  #   - "https://app.example"

  # How long a connection may sit unauthenticated before it is dropped.
  authTimeout: "5s"

  # Heartbeat period. A peer that stops answering pings is disconnected rather
  # than left holding a routing identity in the room.
  pingInterval: "30s"

  # Also mount /huddle/{id}/rtc, a WebRTC endpoint, so a browser can join the
  # same rooms. Both endpoints share one set of rooms: a browser and a buzz
  # client using the same room id are in the same call, not two.
  #
  # WebRTC is what makes video and screen share possible at all -- the
  # WebSocket endpoint carries audio only.
  rtc: true

  # STUN/TURN offered to WebRTC clients. With none, only peers on the same
  # network will connect. STUN gets most peers through NAT; TURN is what
  # carries the ones behind symmetric NAT, and needs credentials.
  iceServers:
    - urls:
        - "stun:stun.l.google.com:19302"
    # - urls:
    #     - "turn:turn.example.com:3478"
    #   username: "relay"
    #   credential: "a-long-random-secret"

  # Pin the UDP ports media is carried on. Leave it out on a host with nothing
  # filtering in the way and the OS picks from the ephemeral range. Set it when
  # the relay runs in a container or behind a firewall: those ports have to be
  # published or opened, and without that signalling succeeds and no audio ever
  # arrives -- the call sits in `connecting` until ICE gives up.
  #
  # Size it for the calls you expect to carry, not for one.
  # udpPortRange: "21600-21650"

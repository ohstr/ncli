# Scenario: a public, high-traffic relay for a topic community -- anyone can
# read or post, and the draw is that profile search and "what's trending"
# actually work well, instead of every client building its own index from a
# firehose. See examples/relay/full.yaml for the complete set of nip11
# fields and which ones `ncli relay` actually honors from config vs. always
# overwrites.
nip11:
  name: "Open Community Relay"
  description: "Public relay with profile search and zap-ranked trending"
  # Generated with `ncli id --json` for this example only -- never reuse a
  # privkey that's ever appeared in a public repo for anything real.
  # Needed here because cache.topZapped.enabled requires it (the relay signs
  # its own cached "top zapped" response), and it's also what unlocks
  # `ncli relay stats`/`reindex`/`clear` against this same relay later.
  privkey: "cf7b085cd0e28c3c2237e5899b76ec8cecbadb1f78e4ef13d122e25b538cca21"
  # pubkey is optional once privkey is set -- ncli derives and fills it in
  # automatically at startup. Left here anyway so it's visible without
  # running the binary; must match the privkey above if both are present.
  pubkey: "e5a99a604c37f95c36257a1b6d0eff2eb5645b174813175c9460a5ccd0767b18"
  contact: "admin@example.com"
  # No auth_required/membership here on purpose: the whole point is that
  # anyone can show up and be heard. See
  # examples/relay/community-membership-relay.yaml if posting should be
  # gated instead.

logdir: "./data/logs"
store: "./data/db/public-search.db"
port: 5512

cache:
  # Serve a privkey-signed "top zapped" cache response, so a client's trending
  # tab doesn't need to tally every zap itself.
  topZapped:
    enabled: true
    # Default window when a client's cache filter doesn't specify its own
    # (see examples/filters.yaml) -- same duration units as filter
    # since/until. Falls back to 24h if omitted.
    window: 24h

  # Profile search via Meilisearch, so `ncli find`/other clients can resolve
  # "@alice" style lookups against this relay instead of only exact pubkeys.
  # Indexes kind-0 profiles only (name/about/nip05/lud16), not note content.
  search:
    enabled: true
    host: "http://127.0.0.1:7700"
    key: "masterKey"
    index_name: "ncli_public_search"
    batch_size: 1000
    max_ch_size: 10000

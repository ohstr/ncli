# Relay-under-test for the agent-eval harness. Adapted from
# examples/relay/community-membership-relay.yaml (upstream ncli repo) --
# membership admin
# (relay members/invites/roles, round R3) needs nip11.privkey + enabled: true;
# stats/reindex/clear (also R3) need nip11.privkey too. auth_required is left
# off so R4 (publish/apply) doesn't need a cross-round enrollment step first --
# membership admin is exercised on its own, not gating writes.
nip11:
  name: "ncli-agent-eval-relay"
  privkey: "1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
  contact: "admin@example.com"
  # NIP-42 AUTH checks the client's relay tag against this; without it every
  # AUTH fails and private groups are invisible even to their creator. The
  # agent shares the relay's network namespace, so it dials localhost.
  url: "ws://localhost:5500"

membership:
  enabled: true
  inviteTTL: "24h"
  inviteMaxUses: 5
  publishAddRemoveEvents: true

logdir: "/data/logs"
store: "/data/db/notes.db"
port: 5500

# Huddles for R10 (space join/chat). Membership isn't required to join, so
# the agent's identities need no enrollment first.
huddle:
  enabled: true
  requireMembership: false

# Local huddle e2e stack: 1 real `ncli relay` container with huddles enabled.
# See integration/huddle/README.md. Run by hand via `just huddle up`/`down`.
name: ncli-huddle-itest

services:
  relay:
    build:
      context: ../..
      dockerfile: build/relay/Dockerfile
    image: ncli:huddle-itest
    command: ["relay", "--config", "/config/relay.yaml"]
    ports:
      - "21530:5500"
      # Media, matching huddle.udpPortRange in relay.yaml. Without this the
      # WebRTC scenarios negotiate fine and then never carry a packet.
      - "21600-21650:21600-21650/udp"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - relay-data:/app/ncli/data
    restart: unless-stopped

volumes:
  relay-data:

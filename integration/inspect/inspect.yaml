# Spec fixture for the local inspect e2e test stack (see compose.yaml and
# this directory's README). Same schema as examples/apply/inspect.yaml,
# pointed at this stack's fixed localhost ports instead of real public
# relays.
#
# client/inspect_docker_test.go loads this file the same way `ncli apply`
# itself would (loadSpecFromYaml) rather than constructing an *InspectSpec
# by hand, so it exercises the real on-disk schema.
#
# You can also run this by hand against `just inspect up`, e.g.:
#   just inspect up
#   ncli apply -f integration/inspect/inspect.yaml
#   just inspect down
# Unlike stream, inspect has no `raw: true` escape hatch (see this
# directory's README's "Known ncli limitation" note) -- running it by hand
# needs a real terminal.
kind: inspect
spec:
  targets:
    - relay: ws://localhost:45510
      trusted: true
    - relay: ws://localhost:45511
      trusted: true
    - relay: ws://localhost:45512
      trusted: true

  # since: 0, not a rolling window like production defaults -- this test
  # wants every event it publishes to be in-window regardless of wall-clock
  # skew between the test run and whatever it just published.
  filters:
    - since: 0

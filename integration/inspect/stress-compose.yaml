# Inspect stress stack: 15 targets, for real-scale scenarios. Not run in
# CI -- see integration/inspect/README.md's "Stress stack".
name: ncli-inspect-stress-itest

# Reusable service template -- see integration/stream/stress-compose.yaml.
x-relay: &relay
  build:
    context: ../..
    dockerfile: build/relay/Dockerfile
  image: ncli:inspect-stress-itest
  command: ["relay", "--config", "/config/relay.yaml"]
  restart: unless-stopped

services:
  target1:
    <<: *relay
    ports:
      - "21590:5500"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - target1-data:/app/ncli/data


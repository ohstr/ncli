# Heavier, separate inspect stress stack: 15 real target `ncli relay`
# containers (vs. compose.yaml's 3), for scenarios that need genuine
# "many relays as source" scale rather than correctness-only coverage.
# Kept out of compose.yaml/the fast test-integration-inspect path entirely
# -- these containers are only brought up by client/inspect_stress_test.go
# (`just test-integration-inspect-stress`), which is heavier/slower and
# not run in CI by default. See integration/inspect/README.md.
#
# `name:` pins the Compose project name so this stack's containers/
# volumes/network never collide with compose.yaml's (`ncli-inspect-itest`)
# even if both happen to be up at once; distinct host port range too
# (45590-45604 vs. compose.yaml's 45510-45512).
name: ncli-inspect-stress-itest

# Reusable service template -- see integration/stream/stress-compose.yaml's
# identical convention for why (Compose's `x-` prefix is reserved for
# extension fields it never interprets as a service itself).
x-relay: &relay
  build:
    context: ../..
    dockerfile: build/relay/Dockerfile
  image: ncli:inspect-stress-itest
  command: ["relay", "--config", "/config/relay.yaml"]
  restart: unless-stopped

services:
  target1:
    <<: *relay
    ports:
      - "45590:5500"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - target1-data:/app/ncli/data

  target2:
    <<: *relay
    ports:
      - "45591:5500"
    volumes:

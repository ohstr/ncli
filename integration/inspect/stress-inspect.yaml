# Inspect spec fixture for the stress stack (see stress-compose.yaml and
# this directory's README). 15 real target relays instead of inspect.yaml's
# 3, with the same two-filter-object pair as
# integration/stream/stress-stream.yaml (see that file's header for the
# full rationale) so filter correctness can be proven under real
# multi-target load, not just that events arrive at all:
#
#   - kind 1, any author            -> matches filter 1 (kinds only)      -> included
#   - kind 7, integrationPubKey     -> matches filter 2 (kind+author)     -> included
#   - kind 7, integrationPubKeyAlt  -> matches neither (wrong author)     -> excluded
#   - kind 3, any author            -> matches neither (wrong kind)       -> excluded
#
# integrationPubKey below is client/integrationharness_test.go's fixed
# primary test identity's public key -- kept in sync by hand, not
# computed.
#
# client/inspect_stress_test.go loads this file the same way `ncli apply`
# would (loadSpecFromYaml), then overrides `targets` with all 15
# stress-compose.yaml URLs -- only target1 is listed here so this file
# stays a valid, hand-runnable spec on its own.
kind: inspect
spec:
  targets:
    - relay: ws://localhost:45590
      trusted: true

  filters:
    - kinds: [1]
    - kinds: [7]
      authors:
        - "3c1db3dd55e2ff09ba5317dd8eec2339797e9e2ddf74591172735c47f3a2ad6e"

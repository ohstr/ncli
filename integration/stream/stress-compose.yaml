# Heavier, separate stream stress stack: 20 real source `ncli relay`
# containers (vs. compose.yaml's 3) + 1 destination, for scenarios that
# need genuine "many concurrent sources" scale (bug 2's production
# topology was ~55 sources -> 1 destination) rather than correctness-only
# coverage. Kept out of compose.yaml/the fast test-integration-stream path
# entirely -- these containers are only brought up by
# client/stream_stress_test.go (`just test-integration-stream-stress`),
# which is heavier/slower and not run in CI by default. See
# integration/stream/README.md.
#
# `name:` pins the Compose project name so this stack's containers/
# volumes/network never collide with compose.yaml's (`ncli-stream-itest`)
# even if both happen to be up at once; distinct host port range too
# (45560-45580 vs. compose.yaml's 45500-45505).
name: ncli-stream-stress-itest

# Reusable service template (Compose's `x-` prefix is reserved for
# extension fields it never interprets as a service itself) -- every
# service below merges this in via the `<<:` YAML merge key and then only
# specifies what's actually unique to it (port, volumes). Cuts ~20 repeats
# of the identical build/image/command/restart block down to one.
x-relay: &relay
  build:
    context: ../..
    dockerfile: build/relay/Dockerfile
  image: ncli:stream-stress-itest
  command: ["relay", "--config", "/config/relay.yaml"]
  restart: unless-stopped

services:
  destination:
    <<: *relay
    ports:
      - "45560:5500"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - destination-data:/app/ncli/data

  source1:
    <<: *relay
    ports:
      - "45561:5500"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - source1-data:/app/ncli/data


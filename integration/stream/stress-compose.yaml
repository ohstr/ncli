# Stream stress stack: 20 sources + 1 destination, for real-scale
# scenarios (compose.yaml's 3 sources only prove the mechanism). Not run
# in CI -- see integration/stream/README.md's "Stress stack".
name: ncli-stream-stress-itest

# Reusable service template (Compose ignores `x-` keys); each service
# merges this via `<<:` and adds only its own port/volumes.
x-relay: &relay
  build:
    context: ../..
    dockerfile: build/relay/Dockerfile
  image: ncli:stream-stress-itest
  command: ["relay", "--config", "/config/relay.yaml"]
  restart: unless-stopped

services:
  destination:
    <<: *relay
    ports:
      - "21560:5500"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - destination-data:/app/ncli/data

  source1:
    <<: *relay
    ports:

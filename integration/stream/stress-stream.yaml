# Stress stack fixture: 20 sources -> 1 destination. Two filters (OR'd;
# fields within one filter are AND'd) so client/stream_stress_test.go can
# test matching under load:
#   kind 1, any author           -> filter 1 -> included
#   kind 7, integrationPubKey    -> filter 2 -> included
#   kind 7, integrationPubKeyAlt -> neither   -> excluded
#   kind 3, any author           -> neither   -> excluded
# pubkey below is client/integrationharness_test.go's integrationPubKey.
kind: stream
spec:
  timeouts:
    handshake: "2s"
    ping: "2s"
    pong: "4s"
    write: "5s"

  filters:
    - kinds: [1]
    - kinds: [7]
      authors:
        - "3c1db3dd55e2ff09ba5317dd8eec2339797e9e2ddf74591172735c47f3a2ad6e"

  # The Go test overrides `from` with all 20 source URLs; only source1
  # here so this stays a valid standalone spec.
  from:
    - relay: ws://localhost:45561
      trusted: true

  to:
    - relay: ws://localhost:45560
      trusted: true
      writeConcurrency: 32

  recovery:
    store_path: ./integration/stream/.recovery-stress/stream.db
    max_retries: 50
    retry_interval: "1s"

  raw: true
  strictPow: false

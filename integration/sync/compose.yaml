# Local sync e2e stack: 2 real `ncli relay` containers -- the same relay
# config run twice, so negentropy can move events from one to the other
# without a third-party relay. See integration/sync/README.md. Run by hand
# via `just sync up`/`down`.
name: ncli-sync-itest

# Reusable service template (Compose ignores `x-` keys); each service
# merges this via `<<:` and adds only its own port/volumes.
x-relay: &relay
  build:
    context: ../..
    dockerfile: build/relay/Dockerfile
  image: ncli:sync-itest
  command: ["relay", "--config", "/config/relay.yaml"]
  restart: unless-stopped

services:
  remote:
    <<: *relay
    ports:
      - "21520:5500"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - remote-data:/app/ncli/data

  # Second instance, empty at startup: the destination the negentropy
  # propagation scenario syncs into.
  remote2:
    <<: *relay
    ports:
      - "21521:5500"
    volumes:
      - ./relay.yaml:/config/relay.yaml:ro
      - remote2-data:/app/ncli/data

  # strfry, as most NIP-77 public relays run it: rejects any message over
  # 128 KiB, which a large diff only stays under if sync caps its frames.
  strfry:
    # Only `latest` is published; pinned by digest.
    image: ghcr.io/hoytech/strfry@sha256:36f1886d185a88ca57c66ebe52e6e9e8428dac2486eea0a5d50ff934f18b60c3
    ports:
      - "21522:7777"
    volumes:
      - ./strfry.conf:/etc/strfry.conf:ro
      - strfry-data:/app/strfry-db

volumes:
  remote-data:
  remote2-data:
  strfry-data:

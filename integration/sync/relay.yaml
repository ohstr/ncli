# Shared relay config for both services in compose.yaml -- `remote` and
# `remote2` use this exact file. Safe for the same reasons as
# integration/inspect/relay.yaml: each service gets its own named volume at
# /app/ncli/data, so the identical relative store/logdir paths never
# collide, and 5500 is only ever the container-internal port (the host-side
# ports differ, 45520 and 45521). Both instances therefore share one relay
# identity, which nothing in this harness depends on being distinct.
port: 5500

nip11:
  name: ncli-sync-itest-relay
  privkey: 0acd12cbf0fb87cd13b17bc9b57dffd11b3870b407984cec5a4ce2a69b90268c

store: ./data/db/notes.db
logdir: ./data/logs

# strfry for the large-diff sync scenario; unset keys keep strfry's defaults
# (negentropy on). The payload cap is strfry's default, set here because the
# test depends on it.
db = "/app/strfry-db/"

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
    maxWebsocketPayloadSize = 131072
}
